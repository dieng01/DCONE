services:
  # MongoDB Database - Lưu trữ dữ liệu market
  mongodb:
    image: mongo:7.0
    container_name: market-monitor-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=restheart
    restart: unless-stopped
    networks:
      - market-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RESTHeart - MQTT Broker + REST API + MongoDB Connector
  restheart:
    image: softinstigate/restheart:latest
    container_name: market-monitor-restheart
    ports:
      - "8080:8080"   # REST API
      - "11884:1883"  # MQTT TCP; host port avoids Windows reserved range
      - "8884:8883"   # MQTT WebSocket (đổi 8883 -> 8884 để tránh conflict)
    environment:
      - MONGO_URI=mongodb://mongodb:27017/restheart
      - RESTHEART_OPTS=-o etc/mqtt.properties
    volumes:
      - ./restheart-config:/opt/restheart/etc/custom
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - market-network

  # MQTT Data Publisher - Publish market data to RESTHeart
  publisher:
    build:
      context: ./publisher
      dockerfile: Dockerfile
    container_name: market-monitor-publisher
    environment:
      - MQTT_BROKER=restheart
      - MQTT_PORT=1883
      - PUBLISH_INTERVAL=2000
    depends_on:
      restheart:
        condition: service_started
    restart: unless-stopped
    networks:
      - market-network

volumes:
  mongodb_:
    driver: local
  mongodb_config:
    driver: local

networks:
  market-network:
    driver: bridge
